{{define "team_row"}}
<div class="row" id="team-{{.Team.ID}}">
<div class="c1">{{.Team.Name}}</div>
<div class="c2">
{{range .Speakers}}
<span class="spk{{if not .IsActive}} mut{{end}}" id="speaker-{{.ID}}"><span class="spk-name">{{.Name}}{{if not .IsActive}} (subbed){{end}}</span>
<button type="button" class="btn ghost sm" hx-patch="/admin/speakers/{{.ID}}/redact" hx-prompt="New name for {{.Name}}" hx-target="#speaker-{{.ID}} .spk-name" hx-swap="innerText">Redact</button>
</span>
{{end}}
</div>
<div class="c3">
<button type="button" class="pillbtn" title="Toggle active" hx-post="/admin/teams/toggle-active" hx-vals='{"team_id": "{{.Team.ID}}"}' hx-target="#team-{{.Team.ID}}" hx-swap="outerHTML">
{{if .Team.IsActive}}<span class="pill"><i class="i"></i>active</span>{{else}}<span class="pill"><i class="i a"></i>out</span>{{end}}
</button>
</div>
<div class="c4">
<form class="subform" action="/admin/teams/{{.Team.ID}}/substitute-speaker" method="post">
<select class="txtin sm" name="old_speaker_id" required>
{{range .Speakers}}{{if .IsActive}}<option value="{{.ID}}">Sub {{.Name}}</option>{{end}}{{end}}
</select>
<input class="txtin sm" type="text" name="new_name" placeholder="New speaker" required>
<button class="btn ghost sm" type="submit">Sub</button>
</form>
</div>
</div>
{{end}}
