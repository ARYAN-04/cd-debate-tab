{{define "team_row"}}
<div class="row" id="team-{{.Team.ID}}">
<div class="c1">{{.Team.Name}}</div>
<div class="c2">
{{range .Speakers}}
<span>{{.Name}}
<button class="linkbtn" hx-patch="/admin/speakers/{{.ID}}/redact" hx-prompt="New name for {{.Name}}">redact</button>
</span>
{{end}}
</div>
<div class="c3">{{if .Team.IsActive}}<span class="pill"><i class="i"></i>active</span>{{else}}<span class="pill"><i class="i a"></i>out</span>{{end}}</div>
<div class="c4">
<button class="btn ghost sm" hx-post="/admin/teams/toggle-active" hx-vals='{"team_id": "{{.Team.ID}}"}' hx-target="#team-{{.Team.ID}}" hx-swap="outerHTML">toggle</button>
<form style="display:inline" action="/admin/teams/{{.Team.ID}}/substitute-speaker" method="post">
<input type="hidden" name="old_speaker_id" value="{{if .Speakers}}{{(index .Speakers 0).ID}}{{end}}">
<input class="txtin sm" type="text" name="new_name" placeholder="New speaker" required>
<button class="linkbtn" type="submit">sub</button>
</form>
</div>
</div>
{{end}}
