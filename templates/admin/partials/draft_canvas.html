{{define "draft_canvas"}}
<div id="draft-canvas">
{{if .Imbalanced}}
<div id="imbalance-badge" class="badge">Imbalanced Rooms: Room sizes differ by more than 1 team. (Δ={{.Delta}})</div>
{{end}}
<div class="board">
{{range .Rooms}}
<section class="col" data-room-id="{{.ID}}">
<h2>{{.Name}} <span class="count">· {{len .Cards}}</span></h2>
<div class="sortable-list" data-room-id="{{.ID}}">
{{range .Cards}}
<article class="tcard" data-team-id="{{.TeamID}}">
<div class="thead">
<strong>{{.TeamName}}</strong>
<button class="btn ghost sm" hx-post="/admin/rounds/{{$.Round.ID}}/teams/{{.TeamID}}/flip-sides" hx-target="#draft-canvas" hx-swap="outerHTML">Flip sides</button>
</div>
{{range .Speakers}}<span>{{.Speaker}} · {{.Allocation.Side}}</span>{{end}}
</article>
{{end}}
</div>
</section>
{{end}}
</div>
</div>
{{end}}
