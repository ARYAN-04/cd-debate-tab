{{define "draft"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft {{.Round.Name}} · Debate Tab</title>
<link rel="stylesheet" href="/static/css/admin.css">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body data-round-id="{{.Round.ID}}">
<div class="app">
{{template "sidebar" "rounds"}}
<div class="main">
<div class="top"><div class="crumb">rounds / <b>Draft · {{.Round.Name}}</b></div></div>
<div class="panel">
<div class="h1">Draft · {{.Round.Name}}</div>
<p class="sub">Drag cards between rooms. Status: {{.Round.Status}} · bias counts published rounds only.</p>
{{template "draft_canvas" .}}
<div class="actions">
<form action="/admin/rounds/{{.Round.ID}}/publish" method="post"><button class="btn sm" type="submit">Publish</button></form>
<form action="/admin/rounds/{{.Round.ID}}/conclude" method="post"><button class="btn ghost sm" type="submit">Conclude</button></form>
</div>
</div>
</div>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
