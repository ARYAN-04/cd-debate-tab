{{define "import_errors"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix import · Debate Tab</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="app">
{{template "sidebar" "teams"}}
<div class="main">
<div class="top"><div class="crumb">teams / <b>Fix import</b></div></div>
<div class="panel">
<div class="h1">Fix {{len .Errs}} bad rows</div>
<p class="sub">Valid rows were kept. Correct the rows below and resubmit.</p>
<div class="errbox">
<form action="/admin/teams/manual-batch" method="post">
{{range .Errs}}
<div class="errrow">
<span class="errline">line {{.Line}}</span>
<input class="txtin" type="text" name="row" value="{{.Raw}}">
<span class="errwhy">{{.Reason}}</span>
</div>
{{end}}
<button class="btn sm" type="submit">Submit corrections</button>
</form>
</div>
</div>
</div>
</div>
</body>
</html>
{{end}}
