{{define "teams"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams · Debate Tab</title>
<link rel="stylesheet" href="/static/css/dist.css">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="p-4 max-w-6xl mx-auto">
<h1 class="text-2xl font-bold mb-4">Teams</h1>
<form class="mb-6 flex gap-2" action="/admin/teams/import" method="post" enctype="multipart/form-data">
<input type="file" name="csv" accept=".csv" class="text-sm">
<button class="px-3 py-1 bg-emerald-600 rounded" type="submit">Import CSV</button>
</form>
<table class="w-full text-sm border border-slate-800">
<thead><tr class="text-left text-slate-400"><th class="p-2">Team</th><th class="p-2">Speakers</th><th class="p-2">Active</th><th class="p-2">Actions</th></tr></thead>
<tbody id="team-rows">
{{range .Teams}}{{template "team_row" .}}{{end}}
</tbody>
</table>
</main>
</body>
</html>
{{end}}
