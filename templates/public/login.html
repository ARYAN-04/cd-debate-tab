{{define "login"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Yellow-CD</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="pubwrap">
<header class="pubtop">
<div class="wordmark">Yellow-CD</div>
<a class="btn ghost sm" href="/">View draw</a>
</header>
<div class="panel" style="max-width:520px">
<div class="h1">Admin login</div>
<p class="sub">Sessions last 24 hours.</p>
<div class="set">
{{if .Err}}<div class="errbox"><h2>Invalid username or password.</h2></div>{{end}}
<form action="/login" method="post">
<div><label>Username</label><input name="username" autocomplete="username" required></div>
<div><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
<div><button class="btn" type="submit">Login</button></div>
</form>
</div>
</div>
</div>
</body>
</html>
{{end}}
