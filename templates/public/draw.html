{{define "draw"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw · Debate Tab</title>
<link rel="stylesheet" href="/static/css/admin.css">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>
<body>
<div class="pubwrap">
<header class="pubtop">
<div class="wordmark">Debate Tab</div>
{{if .IsAdmin}}<a class="btn ghost sm" href="/admin/teams">Open dashboard</a>{{else}}<a class="btn ghost sm" href="/login">Admin login</a>{{end}}
</header>
<div class="panel">
<div class="h1">Live draw</div>
<p class="sub">Updates automatically when a round is published.</p>
{{if .Rounds}}
<form class="roundpick" action="/" method="get">
<label class="mut" for="round">Round</label>
<select class="txtin sm" id="round" name="round" onchange="this.form.submit()">
{{range .Rounds}}<option value="{{.ID}}" {{if eq .ID $.CurrentRound}}selected{{end}}>{{.Name}} · {{.Status}}</option>{{end}}
</select>
</form>
{{end}}
<div hx-ext="sse" sse-connect="/events" sse-swap="draw-published" hx-target="#draw-grid" hx-swap="innerHTML"></div>
<input type="hidden" name="round" value="{{.CurrentRound}}">
<input class="txtin" style="margin-bottom:16px" type="search"
name="q" placeholder="Search team or speaker…" hx-get="/draw/search" hx-include="[name=round]" hx-target="#draw-grid" hx-swap="innerHTML" hx-trigger="keyup changed delay:300ms">
<div id="draw-grid">{{template "draw_grid" .}}</div>
</div>
</div>
</body>
</html>
{{end}}
