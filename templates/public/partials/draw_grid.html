{{define "draw_grid"}}
<div id="draw-grid" class="grid gap-3 md:grid-cols-2">
{{range .Allocs}}
<div class="rounded border border-slate-700 p-3">
<div class="text-xs text-slate-400">{{.RoomName}}</div>
<div class="font-bold">{{.TeamName}}</div>
<div class="text-sm">{{.Speaker}} · <span class="uppercase">{{.Allocation.Side}}</span></div>
</div>
{{else}}
<p class="text-slate-400 text-sm">No draw published yet.</p>
{{end}}
</div>
{{end}}
