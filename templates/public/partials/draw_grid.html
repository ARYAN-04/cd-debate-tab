{{define "draw_grid"}}
<div id="draw-grid">
<div class="board" style="grid-template-columns:repeat(2,1fr)">
{{range .Allocs}}
<div class="tcard">
<div class="mut" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em">{{.RoomName}}</div>
<b>{{.TeamName}}</b>
<span>{{.Speaker}} · {{.Allocation.Side}}</span>
</div>
{{else}}
<p class="mut">No draw published yet.</p>
{{end}}
</div>
</div>
{{end}}
