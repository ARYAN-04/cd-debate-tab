{{define "draw_grid"}}
<div id="draw-grid">
{{range .Rooms}}
<section style="margin-bottom:28px">
<p class="lbl">{{.Name}}</p>
<div class="box">
<div class="row head"><div class="c1">Team</div><div class="c2">For</div><div class="c2">Against</div></div>
{{range .Rows}}
<div class="row">
<div class="c1">{{.Team}}</div>
<div class="c2">{{.For}}</div>
<div class="c2">{{.Against}}</div>
</div>
{{end}}
</div>
</section>
{{else}}
<p class="mut">No draw published yet.</p>
{{end}}
</div>
{{end}}
